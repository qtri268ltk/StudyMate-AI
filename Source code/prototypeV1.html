<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate AI - Trợ lý Đọc hiểu & Ôn tập (Prototype V1.1)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: auto; padding: 20px; background-color: #f9f9fb; }
        h1 { text-align: center; color: #2c3e50; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; font-family: inherit;}
        .button-group { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 15px; }
        button { padding: 10px 15px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1;}
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .output-box { margin-top: 20px; padding: 15px; border-left: 5px solid #2ecc71; background-color: #f0fdf4; border-radius: 4px; min-height: 100px; white-space: pre-wrap; font-size: 15px;}
        .config-box { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #3498db; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>📚 StudyMate AI V1.1 (Auto-Retry)</h1>
    <div class="container">
        
        <div class="config-box">
            <label for="apiKey"><strong>Nhập API Key (Gemini):</strong></label>
            <input type="text" id="apiKey" placeholder="Dán API Key miễn phí từ Google AI Studio vào đây...">
        </div>

        <label for="docContent"><strong>1. Dán nội dung tài liệu của bạn vào đây:</strong></label>
        <textarea id="docContent" placeholder="Dán nội dung tài liệu học tập, sách, hoặc bài báo vào đây để AI xử lý..."></textarea>

        <label><strong>2. Chọn hành động:</strong></label>
        <div class="button-group">
            <button onclick="processAI('summary')" id="btn-summary">📝 Tóm tắt & Trích dẫn</button>
            <button onclick="processAI('flashcard')" id="btn-flashcard">📇 Tạo Flashcards</button>
            <button onclick="processAI('quiz')" id="btn-quiz">✅ Tạo Quiz (Có giải thích)</button>
        </div>

        <div class="loader" id="loader"></div>

        <label><strong>3. Kết quả:</strong></label>
        <div class="output-box" id="output">Kết quả xử lý sẽ hiển thị tại đây...</div>
        
    </div>

    <script>
        async function processAI(taskType) {
            const apiKey = document.getElementById("apiKey").value.trim();
            const docContent = document.getElementById("docContent").value.trim();
            const outputBox = document.getElementById("output");
            const loader = document.getElementById("loader");

            if (!apiKey) return alert("Vui lòng nhập API Key!");
            if (!docContent) return alert("Vui lòng dán nội dung tài liệu!");

            // Vô hiệu hóa nút và hiện loader
            document.querySelectorAll('button').forEach(b => b.disabled = true);
            outputBox.innerText = "AI đang xử lý, vui lòng chờ...";
            loader.style.display = "block";

            // Xây dựng Prompt tương ứng với nhiệm vụ
            let prompt = "";
            const baseInstructions = `
                Dưới đây là nội dung tài liệu học tập:
                --- TÀI LIỆU BẮT ĐẦU ---
                ${docContent}
                --- TÀI LIỆU KẾT THÚC ---
                
                LƯU Ý NGHIÊM NGẶT (GROUNDING): 
                - Tuyệt đối chỉ sử dụng thông tin CÓ TRONG tài liệu trên. Không được tự bịa kiến thức bên ngoài.
                - Mọi thông tin bạn đưa ra ĐỀU PHẢI có trích dẫn nguồn gốc xác thực.
            `;

            if (taskType === 'summary') {
                prompt = baseInstructions + `
                Yêu cầu: Hãy tóm tắt cô đọng lại tài liệu trên thành các ý chính.
                Định dạng bắt buộc cho mỗi ý tóm tắt:
                - [Ý chính tóm tắt] 
                *Nguồn trích dẫn:* "[Copy chính xác đoạn văn gốc chứng minh cho ý này]"
                `;
            } else if (taskType === 'flashcard') {
                prompt = baseInstructions + `
                Yêu cầu: Hãy tạo 5 thẻ ghi nhớ (Flashcard) bóc tách các khái niệm quan trọng nhất.
                Định dạng bắt buộc:
                Thẻ [Số thứ tự]:
                - Mặt trước (Khái niệm/Câu hỏi): ...
                - Mặt sau (Giải thích): ...
                *Nguồn trích dẫn (chứng minh mặt sau):* "[Đoạn văn gốc trong tài liệu]"
                `;
            } else if (taskType === 'quiz') {
                prompt = baseInstructions + `
                Yêu cầu: Hãy tạo 3 câu hỏi trắc nghiệm (Quiz) nhiều lựa chọn (A, B, C, D).
                Định dạng bắt buộc:
                Câu [Số thứ tự]: [Nội dung câu hỏi]
                A. ...
                B. ...
                C. ...
                D. ...
                Đáp án đúng: ...
                Giải thích vì sao đúng: ...
                *Nguồn trích dẫn trong tài liệu:* "[Đoạn văn gốc dùng để tạo ra câu hỏi này]"
                `;
            }

           try {
                // HƯỚNG 2: Khai báo danh sách các model theo thứ tự ưu tiên (Mạnh nhất -> Dự phòng ổn định nhất)
                const modelsToTry = ["gemini-3.8-flash", "gemini-2.5-flash", "gemini-1.5-flash-8b"];
                let success = false;

                // Vòng lặp đổi Model
                for (let model of modelsToTry) {
                    
                    // HƯỚNG 1: Thử lại (Retry) tối đa 2 lần cho MỖI model
                    let maxRetries = 2; 
                    let retryDelay = 1500; // Khởi đầu chờ 1.5 giây
                    let modelSuccess = false;

                    for (let i = 0; i < maxRetries; i++) {
                        outputBox.innerText = `[Hệ thống] Đang kết nối mô hình ${model} (Lần thử ${i + 1}/${maxRetries})...`;
                        
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { temperature: 0.2 } 
                            })
                        });

                        const data = await response.json();
                        
                        if (data.error) {
                            if (data.error.code === 503 || data.error.message.includes("high demand")) {
                                outputBox.innerText = `[${model}] Đang quá tải. Chờ ${retryDelay/1000}s để thử lại...`;
                                await new Promise(resolve => setTimeout(resolve, retryDelay));
                                retryDelay *= 2; // Tăng thời gian chờ cho lần sau
                                continue; 
                            } else {
                                // Lỗi API khác (như sai Key, lỗi tham số), báo lỗi và dừng hoàn toàn
                                outputBox.innerText = `Lỗi API (${model}): ${data.error.message}`;
                                return; 
                            }
                        } else {
                            // Thành công: In kết quả và đánh dấu
                            outputBox.innerText = data.candidates[0].content.parts[0].text;
                            success = true;
                            modelSuccess = true;
                            break; // Thoát vòng lặp retry
                        }
                    } 

                    // Nếu model hiện tại chạy thành công, thoát luôn vòng lặp đổi model
                    if (modelSuccess) {
                        break; 
                    } else {
                        // Nếu sau 2 lần thử model này vẫn quá tải, thông báo và tự động lặp sang model tiếp theo
                        outputBox.innerText = `[${model}] Vẫn quá tải. Đang tự động chuyển sang mô hình dự phòng...`;
                        await new Promise(resolve => setTimeout(resolve, 1000)); // Chờ 1 giây trước khi chuyển
                    }
                }

                // Nếu đã thử hết toàn bộ danh sách Model mà vẫn thất bại
                if (!success) {
                     outputBox.innerText = "Tất cả các máy chủ AI hiện tại đều đang bận. Vui lòng thử lại sau vài phút.";
                }

            } catch (error) {
                outputBox.innerText = `Lỗi hệ thống: ${error.message}`;
            } finally {
                // Mở lại nút và ẩn loader
                loader.style.display = "none";
                document.querySelectorAll('button').forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
